<body>

    <script>
        // If redirected from 404.html, restore path
        (function () {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (path) {
                const base = window.appBasePath || '/';
                const cleanBase = base.endsWith('/') ? base.slice(0, -1) : base;
                window.history.replaceState(null, '', cleanBase + decodeURIComponent(path));
            }
        })();

        // Performance Metrics Logging
        window.addEventListener('load', function () {
            setTimeout(function() {
                var navTiming = performance.timing || {};
                var dllFiles = window._blazorwasmperf ? window._blazorwasmperf.dllFiles || [] : [];
                var totalDllSize = dllFiles.reduce(function(s, f) { return s + (f.size || 0); }, 0);
                var jsFiles = window._blazorwasmperf ? window._blazorwasmperf.jsFiles || [] : [];
                var totalJsSize = jsFiles.reduce(function(s, f) { return s + (f.size || 0); }, 0);
                var totalSize = totalDllSize + totalJsSize;

                console.log('%c📊 MinistryFinanceWebApp Performance Metrics', 'color: #4CAF50; font-size: 16px; font-weight: bold;');
                console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #4CAF50;');
                console.log('🔹 DLLs loaded:', dllFiles.length);
                console.log('🔹 Total DLL size:', (totalDllSize / 1024 / 1024).toFixed(2), 'MB');
                console.log('🔹 Total JS size:', (totalJsSize / 1024 / 1024).toFixed(2), 'MB');
                console.log('🔹 Total download:', (totalSize / 1024 / 1024).toFixed(2), 'MB');
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

                console.log('⏱️ Page Load Time:', (navTiming.loadEventEnd - navTiming.fetchStart).toFixed(0), 'ms');
                console.log('⏱️ DOM Content Loaded:', (navTiming.domContentLoadedEventEnd - navTiming.fetchStart).toFixed(0), 'ms');
                console.log('⏱️ Time to Interactive:', (navTiming.domInteractive - navTiming.fetchStart).toFixed(0), 'ms');

                console.log('%c🎯 Phase 3: Real Lazy Loading ACTIVE!', 'color: #FF5722; font-weight: bold; font-size: 14px;');
                console.log('%c   ✓ Workflows assembly configured for lazy loading', 'color: #FF5722;');
                console.log('%c   ✓ Assembly loads on first access', 'color: #FF5722;');
                console.log('%c   ✓ Reduced initial bundle size', 'color: #FF5722;');
                console.log('%c   ✓ Production-ready lazy loading', 'color: #FF5722;');
                console.log('%c   ℹ️  Navigate to various pages to see lazy loading in action', 'color: #FF5722;');
            }, 100);
        });

        // Lazy Load Tracking Functions
        window.trackLazyLoadStart = function(featureName) {
            window.lazyLoadStart = performance.now();
            console.log('%c⏳ Loading: ' + featureName + '...', 'color: #FF9800; font-weight: bold;');
        };

        window.trackLazyLoadEnd = function(featureName) {
            if (window.lazyLoadStart) {
                var loadTime = performance.now() - window.lazyLoadStart;
                window.lastFeatureLoadTime = loadTime;
                console.log('%c✅ Loaded: ' + featureName + ' in ' + loadTime.toFixed(0) + 'ms', 'color: #4CAF50; font-weight: bold;');
            }
        };

        // Login Tracking Functions
        window.logLoginAttempt = function(username, password) {
            console.log('blazor.webassembly.js:1 User selected: ' + username + ', Password set to: ' + password);
        };

        window.logBeforeLogin = function(username, password) {
            console.log('blazor.webassembly.js:1 Before LoginAsync - Username: ' + username + ', Password: ' + password);
        };

        window.logMockLogin = function(username, password) {
            console.log('blazor.webassembly.js:1 MockAuthenticationService.LoginAsync - Username: ' + username + ', Password: ' + password);
        };
    </script>
