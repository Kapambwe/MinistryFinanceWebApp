<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Shield background -->
  <path d="M100 10 L180 40 L180 120 Q180 160 100 190 Q20 160 20 120 L20 40 Z" fill="#009A44" stroke="#000000" stroke-width="2"/>
  
  <!-- Inner shield -->
  <path d="M100 25 L165 50 L165 115 Q165 145 100 175 Q35 145 35 115 L35 50 Z" fill="#009A44" stroke="#E67712" stroke-width="3"/>
  
  <!-- Eagle -->
  <path d="M100 55 Q85 60 75 70 Q65 80 60 90 L70 88 Q75 85 80 80 Q85 75 100 70 Q115 75 120 80 Q125 85 130 88 L140 90 Q135 80 125 70 Q115 60 100 55" fill="#000000"/>
  
  <!-- Eagle head -->
  <ellipse cx="100" cy="52" rx="8" ry="6" fill="#000000"/>
  
  <!-- Eagle wings -->
  <path d="M60 75 Q40 70 30 85 Q35 80 45 78 Q55 76 60 75" fill="#000000"/>
  <path d="M140 75 Q160 70 170 85 Q165 80 155 78 Q145 76 140 75" fill="#000000"/>
  
  <!-- Fish (Zambezi) -->
  <path d="M85 100 Q90 95 100 95 Q110 95 115 100 Q110 105 100 105 Q90 105 85 100" fill="#E67712"/>
  <path d="M115 100 L125 95 L125 105 Z" fill="#E67712"/>
  
  <!-- Block of three lines (Zambia independence year) -->
  <rect x="92" y="115" width="16" height="3" fill="#E67712"/>
  <rect x="92" y="120" width="16" height="3" fill="#E67712"/>
  <rect x="92" y="125" width="16" height="3" fill="#E67712"/>
  
  <!-- Ground/grass at bottom -->
  <path d="M35 140 Q50 135 65 140 Q80 135 100 140 Q120 135 135 140 Q150 135 165 140 L165 155 Q100 165 35 155 Z" fill="#009A44"/>
  
  <!-- Hoe (representing agriculture) -->
  <line x1="75" y1="130" x2="90" y2="150" stroke="#000000" stroke-width="2"/>
  <path d="M88 148 L98 148 L98 152 L88 152 Z" fill="#8B4513" transform="rotate(30 93 150)"/>
  
  <!-- Pickaxe -->
  <line x1="110" y1="130" x2="125" y2="150" stroke="#000000" stroke-width="2"/>
  <path d="M123 148 L130 145 L130 155 Z" fill="#8B4513" transform="rotate(-30 126 150)"/>
  
  <!-- Maize/corn (representing agriculture) -->
  <path d="M145 135 Q150 130 150 140 Q150 150 145 145" fill="#FFD700" stroke="#000000" stroke-width="1"/>
  <path d="M150 135 Q155 130 155 140 Q155 150 150 145" fill="#FFD700" stroke="#000000" stroke-width="1"/>
</svg>
