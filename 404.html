<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all 404 routes to index.html and preserve path/query
      var subfolder = '/MinistryFinanceWebApp';
      var pathname = location.pathname;
      var search = location.search;
      var hash = location.hash;
      
      // Case-insensitive check and replacement
      var lowerPath = pathname.toLowerCase();
      var lowerSub = subfolder.toLowerCase();
      
      var redirectTo = subfolder + '/index.html' + search + hash;
      var path = '';
      
      if (lowerPath.startsWith(lowerSub)) {
          path = pathname.substring(subfolder.length);
      } else {
          path = pathname;
      }

      if (path && path !== '/' && path !== '/index.html') {
        redirectTo = subfolder + '/index.html' + search + (search ? '&' : '?') + 'path=' + encodeURIComponent(path) + hash;
      }
      
      window.location.replace(redirectTo);
    </script>
</head>
<body>
</body>
</html>
